version: "3.9"

# TaskNet — Microservices
#
# Run from project root:
#   docker compose up --build
#
# Services:
#   gateway    :8000  — API Gateway (routes to all services)
#   auth       :8001  — Auth, users, grade-levels
#   personnel  :8002  — Personnel management
#   tasks      :8003  — Tasks, templates, reports, comments
#   events     :8004  — Event calendar
#   appraisal  :8005  — Appraisal & dashboard

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  volumes:
    - ./backend:/app
    - tasknet_uploads:/app/uploads
  environment:
    SECRET_KEY: ${SECRET_KEY:-tasknet-dev-secret-change-in-prod}
    # MUST be shared by every service — each one validates JWTs with this key.
    # If unset, each service generates its own random key and rejects tokens
    # issued by the auth service (401 on every non-auth endpoint).
    # Signs login tokens. No default on purpose: a known key would let anyone
    # forge a token for any account/role. Set it in .env (see .env.example).
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env - see .env.example}
    # Shared PostgreSQL database (the `postgres` service below).
    DATABASE_URL: ${DATABASE_URL:-postgresql://tasknet:tasknet@postgres:5432/tasknet}
    # Email (account credentials, notifications). Empty MAIL_HOST: no email is sent.
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-2525}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:-TaskNet <no-reply@tasknet.local>}
    APP_URL: ${APP_URL:-http://localhost:5173}
    # Sign-out after this many minutes without activity; longest a sign-in lasts.
    SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
    TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-12}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tasknet_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasknet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasknet}
      POSTGRES_DB: ${POSTGRES_DB:-tasknet}
    ports:
      # Only this computer can reach the database (pgAdmin/DBeaver on localhost still work);
      # other devices on the network cannot.
      - "127.0.0.1:5432:5432"
    volumes:
      - tasknet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasknet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── API Gateway ──────────────────────────────────────────────────────────────
  gateway:
    <<: *backend-common
    container_name: tasknet_gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - auth
      - personnel
      - tasks
      - events
      - appraisal
    environment:
      SECRET_KEY: ${SECRET_KEY:-tasknet-dev-secret-change-in-prod}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env - see .env.example}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tasknet:tasknet@postgres:5432/tasknet}
      AUTH_SERVICE_URL:      http://auth:8001
      PERSONNEL_SERVICE_URL: http://personnel:8002
      TASKS_SERVICE_URL:     http://tasks:8003
      EVENTS_SERVICE_URL:    http://events:8004
      APPRAISAL_SERVICE_URL: http://appraisal:8005
      # Per-IP request limits (per minute); see gateway/main.py.
      RATE_LIMIT_LOGIN:  ${RATE_LIMIT_LOGIN:-20}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60}
      RATE_LIMIT_HEAVY:  ${RATE_LIMIT_HEAVY:-30}
      RATE_LIMIT_WRITES: ${RATE_LIMIT_WRITES:-180}
      RATE_LIMIT_MAX:    ${RATE_LIMIT_MAX:-600}
      TRUSTED_PROXIES:   ${TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.16.0.0/12,192.168.65.0/24}

  # Internal services below publish NO host ports — they are private and only
  # reachable by the gateway over the internal Docker network (service DNS).
  # The gateway (8000) is the single public entry point.

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth:
    <<: *backend-common
    container_name: tasknet_auth
    command: uvicorn services.auth.main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"

  # ── Personnel Service ────────────────────────────────────────────────────────
  personnel:
    <<: *backend-common
    container_name: tasknet_personnel
    command: uvicorn services.personnel.main:app --host 0.0.0.0 --port 8002
    expose:
      - "8002"

  # ── Tasks Service ────────────────────────────────────────────────────────────
  tasks:
    <<: *backend-common
    container_name: tasknet_tasks
    command: uvicorn services.tasks.main:app --host 0.0.0.0 --port 8003
    expose:
      - "8003"

  # ── Events Service ───────────────────────────────────────────────────────────
  events:
    <<: *backend-common
    container_name: tasknet_events
    command: uvicorn services.events.main:app --host 0.0.0.0 --port 8004
    expose:
      - "8004"

  # ── Appraisal Service ────────────────────────────────────────────────────────
  appraisal:
    <<: *backend-common
    container_name: tasknet_appraisal
    command: uvicorn services.appraisal.main:app --host 0.0.0.0 --port 8005
    expose:
      - "8005"

  # ── Web app (React, built and served by nginx) ─────────────────────────────
  # http://localhost:5173 — talks to the gateway on port 8000 of the same host.
  # Rebuild after frontend changes: docker compose up -d --build web
  web:
    build:
      context: ./clients
      dockerfile: web/Dockerfile
    container_name: tasknet_web
    ports:
      - "5173:80"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  tasknet_uploads:
  tasknet_pgdata:

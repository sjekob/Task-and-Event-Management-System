<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>TaskNet</title>
    <script>
      // QR codes printed by the old Flutter web app use hash URLs (/#/eval/3,
      // /#/attendance/3/0/scan?...): move the hash route into the path before
      // the app's router reads the URL.
      if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', location.hash.slice(1));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

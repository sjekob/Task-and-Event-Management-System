# Serves the built single-page app; unknown paths (e.g. /tasks/12) get index.html
# so React Router can render them on refresh.
#
# Security headers are repeated in each location: in nginx, an add_header inside
# a location replaces (not adds to) the ones declared above it.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;   # don't advertise the nginx version

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                       # no clickjacking
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Camera (QR scanning) and location (attendance perimeter) are used by the app itself.
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
